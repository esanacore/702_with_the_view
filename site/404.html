<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found — 702 with the View</title>
  <meta name="robots" content="noindex">
  <script>
    (function () {
      try {
        var stored = localStorage.getItem("702-theme");
        if (stored === "dark" || stored === "light") {
          document.documentElement.dataset.theme = stored;
        }
      } catch (e) { /* storage unavailable — fall through to system theme */ }
    })();
  </script>
  <link rel="stylesheet" href="/styles.css">
  <style>
    .notfound {
      min-height: 70vh;
      display: grid;
      place-content: center;
      text-align: center;
      padding: 2rem;
    }
    .notfound h1 { font-size: clamp(2rem, 6vw, 3rem); margin-bottom: 0.75rem; }
    .notfound p { color: var(--ink-soft); margin-bottom: 1.75rem; }
  </style>
</head>
<body>
  <main class="notfound">
    <div>
      <p class="overline">404</p>
      <h1>That page drifted off.</h1>
      <p>Whatever was here has floated away — the view, however, is right where we left it.</p>
      <a class="btn btn--primary" href="/">Back to the listing</a>
    </div>
  </main>
</body>
</html>
